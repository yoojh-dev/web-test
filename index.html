```html
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MacBook Air 개발환경 테스트</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f2f2f2;
      }

      .card {
        width: min(90%, 520px);
        padding: 32px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        text-align: center;
      }

      h1 {
        margin-top: 0;
      }

      .status {
        margin: 24px 0;
        padding: 16px;
        border-radius: 10px;
        background: #eef6ff;
      }

      button {
        padding: 12px 20px;
        border: 0;
        border-radius: 8px;
        background: #007aff;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.85;
      }

      #counter {
        margin-top: 16px;
        font-size: 20px;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <h1>MacBook Air 개발환경 테스트</h1>

      <div class="status">
        <p>VS Code + Node.js 환경이 정상적으로 구성되었습니다.</p>
        <p id="time"></p>
      </div>

      <button id="testButton">JavaScript 테스트</button>

      <div id="counter">클릭 횟수: 0</div>
    </main>

    <script>
      let count = 0;

      const button = document.getElementById("testButton");
      const counter = document.getElementById("counter");
      const time = document.getElementById("time");

      function updateTime() {
        const now = new Date();
        time.textContent = `현재 시간: ${now.toLocaleTimeString()}`;
      }

      button.addEventListener("click", () => {
        count += 1;
        counter.textContent = `클릭 횟수: ${count}`;
      });

      updateTime();
      setInterval(updateTime, 1000);
    </script>
  </body>
</html>
```
